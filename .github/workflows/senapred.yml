name: GridVision - Actualizar SENAPRED

on:
  workflow_dispatch:

  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "gridvision-pages"
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Consultar SENAPRED
        run: |
          python scripts/exportar_alertas_senapred.py

      - name: Validar JSON SENAPRED
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          archivo = Path("data/alertas_senapred.json")

          if not archivo.exists():
              raise SystemExit(
                  "ERROR: no se genero data/alertas_senapred.json"
              )

          with archivo.open("r", encoding="utf-8") as f:
              datos = json.load(f)

          if datos.get("fuente") != "SENAPRED":
              raise SystemExit(
                  "ERROR: fuente SENAPRED invalida"
              )

          if not isinstance(datos.get("alertas"), list):
              raise SystemExit(
                  "ERROR: estructura de alertas invalida"
              )

          if datos.get("totalAlertasSenapred", 0) <= 0:
              raise SystemExit(
                  "ERROR: SENAPRED devolvio cero registros"
              )

          print("Generado:", datos.get("generadoEn"))
          print(
              "Registros SENAPRED:",
              datos.get("totalAlertasSenapred")
          )
          print(
              "Alertas GridVision:",
              datos.get("totalAlertasRelevantes")
          )
          print("OK - JSON validado")
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Publicar GridVision
        id: deployment
        uses: actions/deploy-pages@v4
