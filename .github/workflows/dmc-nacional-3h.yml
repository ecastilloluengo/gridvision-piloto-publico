name: DMC nacional - marcha blanca cada 3 horas

on:
  # Publicar Pages en cambios manuales a main, sin sincronizar innecesariamente DMC.
  push:
    branches: [main]
  # 00:17, 03:17, 06:17... UTC. GitHub puede demorar el inicio.
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gridvision-publicacion-pages-dmc
  cancel-in-progress: false

jobs:
  sincronizar:
    # Los push manuales solo publican Pages; los horarios y manuales sincronizan DMC.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      cambios: ${{ steps.cambios.outputs.cambios }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install 'shapely>=2,<3' 'tzdata>=2026.1'
      - name: Consultar nueva version DMC
        id: dmc
        run: python scripts/control_dmc_automatico.py comprobar --raiz .
      - name: Generar y validar datos nuevos
        if: steps.dmc.outputs.actualizar == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp data/dmc/indice.json "$RUNNER_TEMP/indice_anterior.json"
          python scripts/sincronizar_dmc_nacional.py --raiz . --aplicar
          python scripts/control_dmc_automatico.py validar --raiz . --antes "$RUNNER_TEMP/indice_anterior.json"
      - name: Preparar cambios DMC exclusivamente
        if: steps.dmc.outputs.actualizar == 'true'
        id: cambios
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/dmc/
          nombres=$(git diff --cached --name-only)
          if [[ -z "$nombres" ]]; then
            echo 'cambios=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$nombres" | grep -Ev '^data/dmc/[^/]+\.(json|geojson)$'; then
            echo 'Archivo fuera de data/dmc/' >&2
            exit 1
          fi
          git diff --cached --check
          echo 'cambios=true' >> "$GITHUB_OUTPUT"
      - name: Publicar datos en main
        if: steps.cambios.outputs.cambios == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DMC: sincronizacion nacional validada cada 3 horas'
          git push origin HEAD:main

  desplegar:
    needs: sincronizar
    # Permite desplegar en la prueba manual aunque la DMC no tenga nuevos avisos.
    # Si sincronizar falla, no se publica nada.
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.sincronizar.outputs.cambios == 'true') && (needs.sincronizar.result == 'success' || needs.sincronizar.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - name: Obtener ultima version confirmada de main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Preparar el sitio estatico existente de GridVision
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Publicar el sitio completo en GitHub Pages
        id: publicacion
        uses: actions/deploy-pages@v4
      - name: Comprobar fecha DMC visible en el portal
        run: python scripts/control_dmc_automatico.py verificar-web --raiz .
